name = "LeanCA"
version = "0.2.0"
defaultTargets = ["LeanCA"]
buildDir = ".lake/build-CA"

[leanOptions]
# Mathlib convention: undeclared names in statements are errors, not auto-bound implicits.
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "LeanCA"
roots = ["ToMathlib", "ComplexAnalysis"]
globs = [
  "ToMathlib", "ToMathlib.+",
  "ComplexAnalysis", "ComplexAnalysis.+",
]

[[lean_exe]]
name = "main"
root = "LeanCA"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Shared upgrade snapshot, 2026-10-18: Lean v4.36.0-rc1.
rev = "911003dd6dea5df215dff57f2717be762e11a6ca"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "5cdecf40e99d5a5ad0833afff31f5b007d68a149"
