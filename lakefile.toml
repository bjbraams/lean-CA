name = "LeanCA"
version = "0.2.0"
defaultTargets = ["LeanCA"]
buildDir = ".lake/build-CA"

[[lean_lib]]
name = "LeanCA"
roots = ["ToMathlib", "ComplexAnalysis"]
globs = [
  "ToMathlib", "ToMathlib.+",
  "ComplexAnalysis", "ComplexAnalysis.+",
]

[[lean_exe]]
name = "main"
root = "LeanCA"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[require]]
name = "mathlib"
scope = "leanprover-community"
# rc3 theorem sources, with dependency updates matching TauCeti a780c7ad6beb.
rev = "5e0c4e5239cb0a2d86d68a884bf52cfd963fce22"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "a780c7ad6beb23f60a17351a492d177878020ad5"
