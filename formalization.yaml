# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Palomar submission draft: all compared statements are listed in alignment.
version: v0.4

project:
  name: 'lean-CA: foundations of complex analysis of one variable in Lean 4'
  description: >-
    A Lean 4 formalization, built on Mathlib, of classical complex analysis of one variable. The 45
    compared results cover global primitives and logarithms, Cauchy and residue theory for cycles,
    Laurent expansions, the argument principle and Rouché, Hurwitz and local mapping, Montel and Vitali,
    Runge approximation and Mittag–Leffler, Cauchy–Pompeiu, Weierstrass and Hadamard factorization,
    Blaschke and Riesz factorization, normalized Riemann mapping, Schwarz–Pick and Koebe estimates,
    harmonic and subharmonic functions, the Dirichlet problem and Green functions under an exterior-disc
    condition, reflection, natural boundaries and removability. Several integral and local results
    allow complex Banach-space values. These are source-based classical results; no new mathematical
    theorem is claimed. The project grew out of work on Carlson’s approach to special functions and
    now provides a separate complex-analysis library.
  authors:
    - Bastiaan J. Braams
  license: Apache-2.0
  responsible_maintainers:
    - Bastiaan J. Braams

repository:
  role: substantive-development

classification:
  arxiv:
    - math.CV
  msc2020:
    - 30C35
    - 30C55
    - 30D15
    - 30D45
    - 30E10
    - 30E20
    - 31A05

sources:
  - title: Functions of One Complex Variable I (second edition)
    authors:
      - John B. Conway
    location: Graduate Texts in Mathematics 11, Springer, 1978
    type: book
    relationship: formalizes
    note: >-
      Conway I: selected results of Chapters IV–XI, especially Cauchy and residue theory, normal families,
      Runge, Mittag–Leffler, products, mapping and potential theory. The alignment below records the
      compared results, not complete coverage of these chapters.
  - title: Functions of One Complex Variable II
    authors:
      - John B. Conway
    location: Graduate Texts in Mathematics 159, Springer, 1995
    type: book
    relationship: formalizes
    note: >-
      Conway II: selected univalent-function results in Chapter 14, potential theory in Chapter 19,
      and Blaschke and Riesz factorization in Chapter 20.
  - title: Complex Analysis (fourth edition)
    authors:
      - Serge Lang
    location: Graduate Texts in Mathematics 103, Springer, 1999
    type: book
    relationship: formalizes
    note: >-
      Lang: classical one-variable theory, particularly Chapter XIII §3 for finite-order entire functions
      and Hadamard factorization; see COVERAGE.md for the wider comparison.
  - title: Complex Analysis
    authors:
      - Theodore W. Gamelin
    location: Undergraduate Texts in Mathematics, Springer, 2001
    type: book
    relationship: formalizes
    note: >-
      Gamelin: Schwarz–Pick, Riemann mapping, normal families, harmonic functions and the Dirichlet
      problem; chapter and section references are in the alignment.
  - title: Complex Analysis
    authors:
      - Elias M. Stein
      - Rami Shakarchi
    location: Princeton Lectures in Analysis II, Princeton University Press, 2003
    type: book
    relationship: formalizes
    note: >-
      Stein–Shakarchi: selected Cauchy, residue and reflection results and Chapter 5 on entire functions
      and Hadamard factorization.
  - title: 'Basic Complex Analysis: A Comprehensive Course in Analysis, Part 2A'
    authors:
      - Barry Simon
    location: American Mathematical Society, 2015
    type: book
    relationship: formalizes
    note: >-
      Simon: selected integral, approximation, mapping and factorization results, as cited in module
      headers and the alignment; no claim of full coverage.
  - title: Classical Analysis in the Complex Plane
    authors:
      - Robert B. Burckel
    location: Birkhäuser/Springer, 2021
    type: book
    relationship: formalizes
    note: >-
      Burckel: selected removability, normal-family and approximation results; also a reference for
      the library coverage review.
  - title: An Introduction to Complex Analysis in Several Variables (second edition)
    authors:
      - Lars Hörmander
    location: North-Holland Mathematical Library 7, North-Holland, 1973
    type: book
    relationship: formalizes
    note: >-
      Only the one-variable Cauchy–Pompeiu and subharmonic material of Chapter I, cited by the corresponding
      module headers; no several-variable theorem is included in the challenge.
  - title: An Introduction to Complex Analysis
    authors:
      - Ravi P. Agarwal
      - Kanishka Perera
      - Sandra Pinelas
    location: Springer, 2011
    type: book
    relationship: background
    note: Companion reference used for the coverage review, especially Lectures 25–44.
  - title: Complex Analysis (third edition)
    authors:
      - Joseph Bak
      - Donald J. Newman
    location: Undergraduate Texts in Mathematics 249, Springer, 2010
    type: book
    relationship: background
    note: Companion reference used for the coverage review, Chapters 4–18.
  - title: Complex Function Theory
    authors:
      - Maurice Heins
    location: Academic Press, 1968
    type: book
    relationship: background
    note: Companion reference for integral theory, approximation, entire functions and conformal mapping.
  - title: Theory of Complex Functions
    authors:
      - Reinhold Remmert
    location: Graduate Texts in Mathematics 122, Springer, 1991
    type: book
    relationship: background
    note: Companion reference for local holomorphic theory, Cauchy formulas, convergence and continuation.

