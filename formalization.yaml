# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Project metadata: the 24 headline results of Challenge.lean and Solution.lean are listed in alignment.
version: v0.4

project:
  name: 'lean-CA: foundations of complex analysis of one variable in Lean 4'
  description: >-
    A Lean 4 formalization, built on Mathlib, of classical complex analysis of one variable.
    The 24 compared results cover primitives on simply connected domains, the residue theorem
    for cycles with isolated singularities of any type, Laurent expansions, Casorati–Weierstrass
    and the classification of isolated singularities, Runge approximation and Mittag–Leffler,
    Cauchy–Pompeiu, Weierstrass and Hadamard factorization, Blaschke and Riesz factorization,
    Koebe estimates, Harnack convergence and subharmonic functions, the Dirichlet problem on
    discs and under an exterior-disc condition, Green functions and a natural boundary. Results
    available in Mathlib or in the TauCeti library are not among them. Several integral and
    local results allow complex Banach-space values. These are source-based classical results; no new mathematical theorem is claimed. The expected
    utility of the project to mathematicians is in the formalization of widely-used fundamental
    theory.
  authors:
    - Bastiaan J. Braams
  license: Apache-2.0
  responsible_maintainers:
    - Bastiaan J. Braams

repository:
  role: substantive-development

classification:
  arxiv: ["math.CV"]
  msc2020: ["30C55", "30D15", "30E10", "30E20", "31A05"]

