    - source: Conway I, VIII.3 (Mittag–Leffler)
      lean: LeanCA.mittag_leffler
      module: Challenge
      status: proved
      note: Mittag–Leffler on an arbitrary open set for a relatively discrete closed set of singularities.
      library_declaration: Complex.mittagLeffler
      library_file: ComplexAnalysis/MittagLeffler.lean
    - source: Hörmander, Chapter I (Cauchy–Pompeiu formula)
      lean: LeanCA.cauchy_pompeiu
