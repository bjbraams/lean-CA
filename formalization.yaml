status:
  scope: >-
    The submission selects 45 principal results from ComplexAnalysis; supporting Analysis and Topology
    modules are used by the proofs but contribute no separately selected theorem. The library contains
    further contour, approximation, continuation and growth theory described in SYNOPSIS.md. This
    is not a complete formalization of the cited books. Full Picard theory, general boundary extension
    of conformal maps and a full Hardy-space inner–outer theory are outside the submission. The counts
    below concern the substantive library and Solution.lean; Challenge.lean intentionally has 45 theorem-proof
    holes and no definition holes.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: manual
      tool_setup: Human choice of scope, references and conventions, direction of development, and
        responsibility for the submission.
    - method: agent
      framework: Codex
      models:
        - gpt-6-astra
    - method: agent
      framework: Claude Code
      models:
        - claude-fable-5-1
        - claude-opus-5-5
  notes: >-
    Human-directed development using GPT and Claude through terminal coding agents. The listed identifiers
    record the latest models used; historical model versions and costs have not been reconstructed.
    Coding agents assisted mathematical development, Lean code design, debugging, documentation and
    review, using terminal builds under AGENTS.md. Lean proofs were produced by AI/LLM exclusively.
    Challenge.lean gives independent statements over Mathlib and explicit supporting definitions;
    Solution.lean proves them using the substantive library in this repository.

fidelity:
  divergences: >-
    The comparison preserves the library hypotheses. Runge disjointness is written as A ∩ K = ∅. Cauchy
    and residue cycles are finite families of closed C¹ paths with vanishing index outside the domain;
    the cycle residue theorem allows isolated singularities of any type, with finitely many specified
    exceptional points. The Laurent theorem uses a closed annulus on which the function is holomorphic
    on a neighborhood. Montel and Vitali allow finite-dimensional complex Banach targets; the iterated-derivative
    convergence statement is pointwise. Mittag–Leffler takes principal parts holomorphic on the whole
    punctured plane at each specified singularity. The sequential Weierstrass factorization uses nonzero
    zeros tending to infinity, with multiplicities; Hadamard uses an intrinsic countable index type,
    including finite and empty cases. HasOrderLE is the explicit bound A exp(B |z|^ρ); the genus k
    satisfies ρ < k + 1 and the polynomial degree is at most k, rather than defining the order by
    a limsup. The Blaschke condition counts multiplicities at nonzero zeros. Riesz factorization gives
    a zero-free bounded factor and is not a complete Hardy-space inner–outer factorization. Koebe
    growth is the upper bound; distortion has both bounds. Subharmonic functions are real-valued;
    the selected C² Laplacian result is the sufficient direction. The general Dirichlet and Green
    results assume bounded open sets with an exterior closed disc touching the closure only at each
    boundary point; the Green function is asserted nonnegative off its pole. Countable-set removability
    and several integral statements generalize scalar textbook formulations. In the two Weierstrass
    challenge statements finite-set cardinality is written as Set.ncard; the product statement also
    includes its proved entire-function property.

review:
  status: agent-reviewed
  notes: >-
    Validated on 24 September 2026 with Lean and Mathlib v4.35.0-rc2. The library passes lake build;
    the submission passes lake build Challenge Solution and lake env lean on each new Lean file. The
    only proof holes are the 45 deliberate Challenge theorem bodies; the library and Solution contain
    none. The metadata passes the v0.4 schema. All 45 solution theorems use only propext, Classical.choice
    and Quot.sound. Comparator accepts all 45 comparisons and the supporting definitions, and Lean’s
    kernel, NanoDa and con-ron accept the exported solution. The ordinary sandbox build could not
    mount this checkout’s intentional .lake symlink, so that source-to-export sandbox stage remains
    unvalidated locally. Instead, the bundled leanexport exported the successfully built modules using
    Comparator’s theorem, axiom and primitive roots; lake comparator checked those exports through
    its supported --challenge-from-export and --solution-from-export options, with its kernel sandboxes
    enabled. Statement selection, hypotheses, copied definitions and credits were reviewed by a coding
    agent. Palomar editorial review is pending; no independent human peer review or source-author
    endorsement is claimed.

alignment:
  namespace: LeanCA
  statements:
    - source: Conway I, IV.5 (Cauchy theory and primitives)
      lean: LeanCA.primitives
      module: Challenge
      status: proved
      note: Primitives on simply connected open sets, with prescribed value; Banach-valued.
      library_declaration: DifferentiableOn.exists_primitive_of_isSimplyConnected
      library_file: ComplexAnalysis/HasPrimitives.lean
    - source: Conway I, IV.6 (logarithms on simply connected domains)
      lean: LeanCA.logarithm
      module: Challenge
      status: proved
      note: A normalized holomorphic logarithm of a nonvanishing function on a simply connected domain.
      library_declaration: Complex.exists_analyticOnNhd_logBranch_eq
      library_file: ComplexAnalysis/BranchLog.lean
    - source: Conway I, IV.5; Remmert, Chapter 8 (Cauchy derivative formulas)
      lean: LeanCA.cauchy_derivatives
      module: Challenge
      status: proved
      note: The Cauchy formula for every iterated derivative at any interior point of a disc.
      library_declaration: DiffContOnCl.iteratedDeriv_eq_circleIntegral_sub_zpow_smul
      library_file: ComplexAnalysis/CauchyDerivatives.lean
    - source: Conway I, IV.4 (index of a closed curve)
      lean: LeanCA.winding_integer
      module: Challenge
      status: proved
      note: The winding index of a closed C¹ curve avoiding the evaluation point is an integer.
      library_declaration: Complex.exists_int_curveIndex
      library_file: ComplexAnalysis/CurveIndex.lean
    - source: Conway I, IV.5.4; Simon, 4.2.1
      lean: LeanCA.cauchy_theorem
      module: Challenge
      status: proved
      note: Cauchy’s theorem for cycles homologous to zero in an open set; Banach-valued.
      library_declaration: Complex.Cycle.integral_eq_zero
      library_file: ComplexAnalysis/Cycle/Cauchy.lean
    - source: Conway I, IV.5.4; Simon, 4.2.1
      lean: LeanCA.cauchy_formula
      module: Challenge
      status: proved
      note: The index-weighted Cauchy formula for cycles homologous to zero; Banach-valued.
      library_declaration: Complex.Cycle.integral_sub_inv_smul_eq_index_smul
      library_file: ComplexAnalysis/Cycle/Cauchy.lean
    - source: Conway I, V.2.2 (residue theorem)
      lean: LeanCA.residue_theorem
      module: Challenge
      status: proved
      note: The residue theorem for a cycle and finitely many isolated singularities of any type.
      library_declaration: Complex.Cycle.integral_eq_sum_index_smul_residue
      library_file: ComplexAnalysis/Cycle/Residue.lean
    - source: Conway I, V.1 (Laurent expansions)
      lean: LeanCA.laurent_expansion
      module: Challenge
      status: proved
      note: The bilateral Laurent expansion on an annulus; Banach-valued.
      library_declaration: Complex.hasSum_circleLaurentCoeff_annulus
      library_file: ComplexAnalysis/LaurentSeries/Basic.lean
    - source: Conway I, V.2 (residues)
      lean: LeanCA.residue_higher_pole
      module: Challenge
      status: proved
      note: The residue of a holomorphic numerator divided by an arbitrary positive power.
      library_declaration: Complex.residue_sub_zpow_smul
      library_file: ComplexAnalysis/Residue.lean
    - source: Conway I, V.3 (argument principle)
      lean: LeanCA.argument_principle
      module: Challenge
      status: proved
      note: The argument principle on a disc, counting meromorphic zeros minus poles.
      library_declaration: Complex.circleIntegral_logDeriv_eq_sum_divisor
      library_file: ComplexAnalysis/ArgumentPrinciple.lean
    - source: Conway I, V.3 (Rouché’s theorem)
      lean: LeanCA.rouche
      module: Challenge
      status: proved
      note: 'Rouché’s theorem on a disc: a strict boundary inequality preserves the total divisor.'
      library_declaration: Complex.sum_divisor_eq_of_norm_sub_lt
      library_file: ComplexAnalysis/Rouche.lean
    - source: Conway I, VII.2 (Hurwitz and normal families)
      lean: LeanCA.hurwitz_zero_free
      module: Challenge
      status: proved
      note: 'Hurwitz: a locally uniform limit of nonvanishing holomorphic functions is zero or nonvanishing.'
      library_declaration: Complex.eqOn_zero_or_forall_ne_zero_of_tendstoLocallyUniformlyOn
      library_file: ComplexAnalysis/Hurwitz.lean
    - source: Conway I, VII.2 (Hurwitz and normal families)
      lean: LeanCA.hurwitz_injective
      module: Challenge
      status: proved
      note: 'Hurwitz: a locally uniform limit of injective holomorphic functions is constant or injective.'
      library_declaration: Complex.eqOn_const_or_injOn_of_tendstoLocallyUniformlyOn
      library_file: ComplexAnalysis/Hurwitz.lean
    - source: Conway I, V.1 (Casorati–Weierstrass)
      lean: LeanCA.casorati_weierstrass
      module: Challenge
      status: proved
      note: 'Casorati–Weierstrass: every punctured neighborhood of an essential singularity has dense
        image.'
      library_declaration: Complex.dense_image_of_not_meromorphicAt
      library_file: ComplexAnalysis/EssentialSingularity.lean
    - source: Conway I, V.1 (isolated singularities)
      lean: LeanCA.isolated_singularity
      module: Challenge
      status: proved
      note: An isolated singularity is removable, a pole, or has dense image on each punctured neighborhood.
      library_declaration: Complex.isolatedSingularity_trichotomy
      library_file: ComplexAnalysis/EssentialSingularity.lean
    - source: Simon, 3.4.1; Conway I, IV.7.4
      lean: LeanCA.local_mapping
      module: Challenge
      status: proved
      note: 'Local mapping with multiplicity: nearby noncritical values have exactly `m` simple preimages.'
      library_declaration: Complex.exists_forall_ncard_preimage_eq
      library_file: ComplexAnalysis/LocalMapping.lean
    - source: Conway I, VII.2 (Montel)
      lean: LeanCA.montel
      module: Challenge
      status: proved
      note: 'Montel: compact-local boundedness gives a holomorphic subsequential limit; finite-dimensional
        values.'
      library_declaration: Complex.exists_subseq_tendstoLocallyUniformlyOn_of_bounded_on_compacts
      library_file: ComplexAnalysis/Montel.lean
    - source: Burckel, VII.2; Gamelin, Chapter XII (Vitali convergence)
      lean: LeanCA.vitali
      module: Challenge
      status: proved
      note: 'Vitali–Porter: convergence on a set with an interior accumulation point implies local
        uniform convergence.'
      library_declaration: Complex.exists_tendstoLocallyUniformlyOn_of_forall_exists_tendsto
      library_file: ComplexAnalysis/Vitali.lean
    - source: Conway I, VII.1–2 (convergence of derivatives)
      lean: LeanCA.derivative_convergence
      module: Challenge
      status: proved
      note: Locally uniform convergence of holomorphic functions implies pointwise convergence of
        every derivative.
      library_declaration: Complex.tendsto_iteratedDeriv_of_tendstoLocallyUniformlyOn
      library_file: ComplexAnalysis/LocallyUniform.lean
    - source: Conway I, VIII.1.7; Simon, 4.7.1
      lean: LeanCA.runge
      module: Challenge
      status: proved
      note: Runge approximation with poles in a set meeting every bounded complementary component.
      library_declaration: Complex.runge
      library_file: ComplexAnalysis/Runge/Theorem.lean
    - source: Conway I, VIII.1.8; Simon, 4.7.3
      lean: LeanCA.runge_polynomial
