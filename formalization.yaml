    location: Graduate Texts in Mathematics 11, Springer, 1978
    type: book
    relationship: formalizes
    note: >-
      Conway I: selected results of Chapters IV–XI, especially primitives, residue theory,
      isolated singularities, Runge, Mittag–Leffler, products and potential theory. The alignment
      below records the compared results, not complete coverage of these chapters.
  - title: Functions of One Complex Variable II
    authors:
      - John B. Conway
    location: Graduate Texts in Mathematics 159, Springer, 1995
    type: book
    relationship: formalizes
    note: >-
      Conway II: selected univalent-function results in Chapter 14, potential theory in Chapter
      19, and Blaschke and Riesz factorization in Chapter 20.
  - title: Complex Analysis (fourth edition)
    authors:
      - Serge Lang
    location: Graduate Texts in Mathematics 103, Springer, 1999
    type: book
    relationship: formalizes
    note: >-
      Lang: classical one-variable theory, particularly Chapter XIII §3 for finite-order entire
      functions and Hadamard factorization; see COVERAGE.md for the wider comparison.
  - title: Complex Analysis
    authors:
      - Theodore W. Gamelin
    location: Undergraduate Texts in Mathematics, Springer, 2001
    type: book
    relationship: formalizes
    note: >-
      Gamelin: harmonic functions, the Dirichlet problem and Green functions; chapter and section
      references are in the alignment.
  - title: Complex Analysis
    authors:
      - Elias M. Stein
      - Rami Shakarchi
    location: Princeton Lectures in Analysis II, Princeton University Press, 2003
    type: book
    relationship: formalizes
    note: >-
      Stein–Shakarchi: Chapter 5 on entire functions and Hadamard factorization.
  - title: 'Basic Complex Analysis: A Comprehensive Course in Analysis, Part 2A'
    authors:
      - Barry Simon
    location: American Mathematical Society, 2015
    type: book
    relationship: formalizes
    note: >-
      Simon: selected approximation, harmonic-function and factorization results, as cited in
      module headers and the alignment; no claim of full coverage.
  - title: Classical Analysis in the Complex Plane
    authors:
      - Robert B. Burckel
    location: Birkhäuser/Springer, 2021
    type: book
    relationship: background
    note: >-
      Burckel: companion reference used for the coverage review, Chapters II–VIII.
  - title: An Introduction to Complex Analysis in Several Variables (second edition)
    authors:
      - Lars Hörmander
    location: North-Holland Mathematical Library 7, North-Holland, 1973
    type: book
    relationship: formalizes
    note: >-
      Only the one-variable Cauchy–Pompeiu and subharmonic material of Chapter I, cited by the
      corresponding module headers; no several-variable theorem is included in the challenge.
  - title: An Introduction to Complex Analysis
    authors:
      - Ravi P. Agarwal
      - Kanishka Perera
      - Sandra Pinelas
    location: Springer, 2011
    type: book
    relationship: background
    note: Companion reference used for the coverage review, especially Lectures 25–44.
  - title: Complex Analysis (third edition)
    authors:
      - Joseph Bak
      - Donald J. Newman
    location: Undergraduate Texts in Mathematics 249, Springer, 2010
    type: book
    relationship: background
    note: Companion reference used for the coverage review, Chapters 4–18.
  - title: Complex Function Theory
    authors:
      - Maurice Heins
    location: Academic Press, 1968
    type: book
    relationship: background
    note: Companion reference for integral theory, approximation, entire functions and conformal
      mapping.
  - title: Theory of Complex Functions
    authors:
      - Reinhold Remmert
    location: Graduate Texts in Mathematics 122, Springer, 1991
    type: book
    relationship: background
    note: Companion reference for local holomorphic theory, Cauchy formulas, convergence and
      continuation.

