status:
  scope: >-
    The headline set selects 24 principal results from ComplexAnalysis that are not available in
    Mathlib or TauCeti; supporting Analysis and
    Topology modules are used by the proofs but contribute no separately selected theorem. The
    library contains further contour, approximation, continuation, mapping and growth theory
    described in SYNOPSIS.md. This is not a complete formalization of the cited books. Full Picard theory,
    general boundary extension of conformal maps and a full Hardy-space inner–outer theory are
    outside the headline set. The counts below concern the substantive library and Solution.lean;
    Challenge.lean intentionally has 24 theorem-proof holes and no definition holes.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: manual
      tool_setup: Human choice of scope, references and conventions, direction of development, and
        responsibility for the project.
    - method: agent
      framework: Codex
      models:
        - gpt-6-astra
    - method: agent
      framework: Claude Code
      models:
        - claude-fable-5-1
        - claude-opus-5-5
  notes: >-
    Human-directed development using GPT and Claude through terminal coding agents. The listed
    identifiers record the latest models used; historical model versions and costs have not been
    reconstructed. Coding agents assisted mathematical development, Lean code design, debugging,
    documentation and review, using terminal builds under AGENTS.md. Lean proofs were produced by
    AI/LLM exclusively. Challenge.lean gives independent statements over Mathlib and explicit
    supporting definitions; Solution.lean proves them using the substantive library in this
    repository.

fidelity:
  divergences: >-
    The comparison preserves the library hypotheses. Runge disjointness is written as A ∩ K = ∅.
    Residue cycles are finite families of closed C¹ paths with vanishing index outside the
    domain; the cycle residue theorem allows Banach-valued functions and isolated singularities
    of any type, with finitely many specified exceptional points. The Laurent theorem uses a
    closed annulus on which the function is holomorphic on a neighborhood. Mittag–Leffler takes principal parts holomorphic on the whole punctured plane at each
    specified singularity;
    the singularity set S ⊆ U is described by the explicit condition that every z ∈ U has a
    positive distance from S \ {z}, which Complex.compl_mem_codiscreteWithin_iff proves equivalent
    to Mathlib's Sᶜ ∈ codiscreteWithin U used by the library theorem Complex.mittagLeffler.
    The sequential Weierstrass factorization uses nonzero zeros tending to infinity, with
    multiplicities; Hadamard uses an intrinsic countable index type, including finite and empty
    cases. HasOrderLE f ρ requires the explicit bound A exp(B |z|^ρ') for every ρ' > ρ, which for
    continuous f is the classical limsup condition on the order; the genus k satisfies ρ < k + 1
    and the polynomial degree is at most k.
    The Blaschke condition counts multiplicities at nonzero zeros. Riesz factorization gives
    a zero-free bounded factor and is not a complete Hardy-space inner–outer factorization.
    Koebe growth is the upper bound; distortion has both bounds. Subharmonic functions are
    real-valued; the selected C² Laplacian result is the sufficient direction.
    The general Dirichlet and Green results assume bounded open sets with an exterior closed disc
    touching the closure only at each boundary point; the Green function is asserted nonnegative
    off its pole. Several integral statements generalize scalar textbook formulations. In the two Weierstrass challenge statements finite-set cardinality is
    written as Set.ncard; the product statement also includes its proved entire-function property.

review:
  status: agent-reviewed
  notes: >-
    Validated on 5 October 2026 on the tree following commit ecb3e4c, with Lean v4.35.0-rc3 and
    the pinned Mathlib and TauCeti revisions. The library passes lake build, and the
    Challenge/Solution pair passes lake build Challenge Solution. The only proof holes are the 24
    deliberate Challenge theorem bodies; the library and Solution contain none. The metadata passes
    the v0.4 schema. All 24 solution
    theorems use only propext, Classical.choice and Quot.sound. Comparator accepts all 24
    comparisons and the supporting definitions, and Lean’s kernel, NanoDa and con-ron accept the
    exported solution. The ordinary sandbox build cannot mount this checkout’s intentional .lake
    symlink, so that source-to-export sandbox stage is not validated locally. Instead, the bundled
    leanexport exported the built modules using Comparator’s theorem, axiom and primitive roots,
    and lake comparator checked those exports through its --challenge-from-export and
    --solution-from-export options, with its kernel sandboxes enabled. Statement selection,
    hypotheses, copied definitions and credits were reviewed by a coding agent. No independent
    human peer review or source-author endorsement is claimed.

alignment:
  namespace: LeanCA
  statements:
    - source: Conway I, IV.5 (Cauchy theory and primitives)
      lean: LeanCA.primitives
      module: Challenge
      status: proved
      note: Primitives on simply connected open sets, with prescribed value; Banach-valued.
      library_declaration: DifferentiableOn.exists_primitive_of_isSimplyConnected
      library_file: ComplexAnalysis/HasPrimitives.lean
    - source: Conway I, V.2.2 (residue theorem)
      lean: LeanCA.residue_theorem
      module: Challenge
      status: proved
      note: The residue theorem for a cycle and finitely many isolated singularities of any type.
      library_declaration: Complex.Cycle.integral_eq_sum_index_smul_residue
      library_file: ComplexAnalysis/Cycle/Residue.lean
    - source: Conway I, V.1 (Laurent expansions)
      lean: LeanCA.laurent_expansion
      module: Challenge
      status: proved
      note: The bilateral Laurent expansion on an annulus; Banach-valued.
      library_declaration: Complex.hasSum_circleLaurentCoeff_annulus
      library_file: ComplexAnalysis/LaurentSeries/Basic.lean
    - source: Conway I, V.1 (Casorati–Weierstrass)
      lean: LeanCA.casorati_weierstrass
      module: Challenge
      status: proved
      note: 'Casorati–Weierstrass: every punctured neighborhood of an essential singularity has dense
        image.'
      library_declaration: Complex.dense_image_of_not_meromorphicAt
      library_file: ComplexAnalysis/EssentialSingularity.lean
    - source: Conway I, V.1 (isolated singularities)
      lean: LeanCA.isolated_singularity
      module: Challenge
      status: proved
      note: An isolated singularity is removable, a pole, or has dense image on each punctured neighborhood.
      library_declaration: Complex.isolatedSingularity_trichotomy
      library_file: ComplexAnalysis/EssentialSingularity.lean
    - source: Conway I, VIII.1.7; Simon, 4.7.1
      lean: LeanCA.runge
      module: Challenge
      status: proved
      note: Runge approximation with poles in a set meeting every bounded complementary component.
      library_declaration: Complex.runge
      library_file: ComplexAnalysis/Runge/Theorem.lean
    - source: Conway I, VIII.1.8; Simon, 4.7.3
      lean: LeanCA.runge_polynomial
      module: Challenge
      status: proved
      note: Polynomial Runge approximation on a compact set with connected complement.
      library_declaration: Complex.exists_polynomial_approx_of_isPreconnected_compl
      library_file: ComplexAnalysis/Runge/Theorem.lean
    - source: Conway I, VIII.3 (Mittag–Leffler)
      lean: LeanCA.mittag_leffler
      module: Challenge
      status: proved
      note: Mittag–Leffler on an arbitrary open set for a set of singularities with no accumulation
        point in the open set, stated by an explicit distance condition.
      library_declaration: Complex.mittagLeffler_of_forall_le_dist
      library_file: ComplexAnalysis/MittagLeffler.lean
    - source: Hörmander, Chapter I (Cauchy–Pompeiu formula)
      lean: LeanCA.cauchy_pompeiu
      module: Challenge
      status: proved
      note: The compact-support C¹ Cauchy–Pompeiu identity; Banach-valued.
      library_declaration: Complex.integral_inv_smul_dbarAlong_fderiv
      library_file: ComplexAnalysis/CauchyPompeiu.lean
    - source: Conway I, VII.5.12–14 (Weierstrass products)
      lean: LeanCA.weierstrass_product
      module: Challenge
      status: proved
      note: The Weierstrass product is entire and has precisely the prescribed zeros, with multiplicities.
      library_declaration: Complex.analyticOrderAt_weierstrassProduct
      library_file: ComplexAnalysis/WeierstrassProduct.lean
    - source: Conway I, VII.5.12–14 (Weierstrass factorization)
      lean: LeanCA.weierstrass_factorization
      module: Challenge
      status: proved
      note: Weierstrass factorization for a nonzero zero sequence tending to infinity, counted with
        multiplicity.
      library_declaration: Complex.exists_exp_mul_weierstrassProduct
      library_file: ComplexAnalysis/WeierstrassProduct.lean
    - source: Lang, XIII.3; Conway I, XI.3.4; Stein–Shakarchi, Chapter 5 (Hadamard)
      lean: LeanCA.hadamard
      module: Challenge
      status: proved
      note: Hadamard factorization for entire functions of order at most ρ, with polynomial degree
        at most the genus.
      library_declaration: Complex.exists_hadamard_factorization
      library_file: ComplexAnalysis/Hadamard.lean
    - source: Simon, 9.9; Conway II, 20.2 (Blaschke condition)
      lean: LeanCA.blaschke_condition
      module: Challenge
      status: proved
      note: The multiplicity-weighted Blaschke condition for nonzero zeros of a bounded nontrivial
        holomorphic function.
      library_declaration: Complex.summable_analyticOrderAt_toNat_mul_one_sub_norm_of_bounded
      library_file: ComplexAnalysis/Blaschke.lean
    - source: Conway II, 20.2.6; Simon, 9.9 (Riesz factorization)
      lean: LeanCA.riesz_factorization
      module: Challenge
      status: proved
      note: Riesz factorization into an origin power, a Blaschke product and a zero-free bounded holomorphic
        factor.
      library_declaration: Complex.exists_rieszFactorization
      library_file: ComplexAnalysis/RieszFactorization.lean
    - source: Conway II, 14.7 (Koebe quarter theorem)
      lean: LeanCA.koebe_quarter
      module: Challenge
      status: proved
      note: Koebe’s quarter theorem for a normalized univalent function.
      library_declaration: Complex.ball_subset_image_of_injOn
      library_file: ComplexAnalysis/Koebe.lean
    - source: Conway II, 14.7 (Koebe distortion)
      lean: LeanCA.koebe_distortion
      module: Challenge
      status: proved
      note: The two-sided Koebe distortion bound for the derivative of a univalent function.
      library_declaration: Complex.distortion_le_of_class_S
      library_file: ComplexAnalysis/KoebeGrowth.lean
    - source: Conway II, 14.7 (upper growth bound)
      lean: LeanCA.koebe_growth
      module: Challenge
      status: proved
      note: The upper Koebe growth bound for a normalized univalent function.
      library_declaration: Complex.norm_le_div_one_sub_sq_of_class_S
      library_file: ComplexAnalysis/KoebeGrowth.lean
    - source: Conway I, X.2.4; Gamelin, X.1; Simon, 5.3
      lean: LeanCA.dirichlet_disc
      module: Challenge
      status: proved
      note: The Dirichlet problem on a disc with arbitrary continuous boundary data.
      library_declaration: Complex.exists_harmonicContOnCl_eqOn_sphere
      library_file: ComplexAnalysis/DirichletDisc.lean
    - source: Conway I, X.2.10–11 (Harnack convergence)
      lean: LeanCA.harnack_convergence
      module: Challenge
      status: proved
      note: Harnack convergence for an increasing harmonic sequence bounded above at one point.
      library_declaration: Complex.exists_harmonicOnNhd_tendstoLocallyUniformlyOn_of_monotone
      library_file: ComplexAnalysis/HarmonicLimit.lean
    - source: Conway I, X.3; Conway II, 19.4 (subharmonic maximum principle)
      lean: LeanCA.subharmonic_maximum
      module: Challenge
      status: proved
      note: The strong maximum principle for real-valued subharmonic functions.
      library_declaration: Complex.SubharmonicOn.eqOn_const_of_isMaxOn
      library_file: ComplexAnalysis/Subharmonic/Basic.lean
    - source: Conway I, X.3; Hörmander, Chapter I (subharmonicity and the Laplacian)
      lean: LeanCA.subharmonic_laplacian
      module: Challenge
      status: proved
      note: A C² function with nonnegative Laplacian is subharmonic.
      library_declaration: Complex.subharmonicOn_of_laplacian_nonneg
      library_file: ComplexAnalysis/Subharmonic/SmoothCriterion.lean
    - source: Conway I, X.4; Gamelin, XV.4 (Perron and barriers)
      lean: LeanCA.dirichlet_exterior_disc
      module: Challenge
      status: proved
      note: The Dirichlet problem on bounded open sets satisfying an exterior-disc condition at every
        boundary point.
      library_declaration: Complex.exists_harmonicOnNhd_tendsto_of_exteriorDisc
      library_file: ComplexAnalysis/Perron/Barrier.lean
    - source: Gamelin, XV.2–3; Conway II, 19.7–19.9 (Green functions)
      lean: LeanCA.green_function
      module: Challenge
      status: proved
      note: A nonnegative Green function with logarithmic singularity and zero boundary limits on
        such a domain.
      library_declaration: Complex.exists_greenFunction
      library_file: ComplexAnalysis/GreenFunction.lean
    - source: Conway I, IX.1, exercises (natural boundaries)
      lean: LeanCA.natural_boundary
      module: Challenge
      status: proved
      note: The lacunary series with exponents `2 ^ n` has no continuous extension across any point
        of the unit circle.
      library_declaration: Complex.not_exists_continuousOn_extension_lacunary
      library_file: ComplexAnalysis/NaturalBoundary.lean

